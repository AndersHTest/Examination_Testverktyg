name: CI Examination

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out code from repository
        uses: actions/checkout@v7

      - name: Python settings
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest
          playwright install

      - name: Flake8 linting
        run: flake8 src tests

      - name: Run pytest
        run: pytest -m "unit or integration" --maxfail=1 --disable-warnings -q

      - name: Run behave
        run: behave --format progress